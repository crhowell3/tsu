[package]
name = "tsu"
version = "0.1.0"
authors = ["Cameron Howell <me@crhowell.com>"]
edition = "2024"
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
anyhow = "1.0.99"
clap = { version = "4.5.47", features = ["derive"] }
crossterm = "0.29.0"
once_cell = "1.21.3"
serde = {version = "1.0.226", features = ["derive"] }
serde_json = "1.0.145"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["fmt", "env-filter"] }
tree-sitter = "0.20.10"
tree-sitter-rust = "0.20.4"
