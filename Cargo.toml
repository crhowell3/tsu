[package]
name = "tsu-editor"
version = "0.2.0"
authors = ["Cameron Howell <me@crhowell.com>"]
edition = "2024"
license = "GPL-3.0"
readme = "README.md"
repository = "https://github.com/crhowell3/tsu"
keywords = ["modal", "editor", "vimlike"]
publish = true

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "tsu"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.99"
async-recursion = "1.1.1"
clap = { version = "4.5.47", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.31"
once_cell = "1.21.3"
ropey = "1.6.1"
serde = {version = "1.0.226", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.47.1", features = ["full"] }
tokio-test = "0.4.4"
toml = "0.9.7"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["fmt", "env-filter"] }
tree-sitter = "0.25.10"
tree-sitter-rust = "0.24.0"
unicode-segmentation = "1.12.0"
unicode-width = "0.2.1"
